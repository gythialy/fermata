<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fermata's banner and social preview, 2:1.

  Rendered by tools/banner/render.sh, which points fontconfig at the fonts the
  app itself bundles (Spectral, Noto Serif SC) so the wordmark matches the
  product. Edit this file, then run `make assets`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Fermata — a menu bar break reminder. A break, held.">
  <title>Fermata — a menu bar break reminder</title>

  <defs>
    <mask id="banner-cool-moon-cut">
      <rect width="96" height="96" fill="black"/>
      <circle cx="46.125" cy="46.875" r="25.5" fill="white"/>
      <circle cx="59.25" cy="38.4375" r="24.1875" fill="black"/>
    </mask>
  </defs>

  <!-- Paper field -->
  <rect width="1280" height="640" fill="#F6F4ED"/>

  <!-- Identity block -->
  <g>
    <circle cx="94" cy="116" r="3.5" fill="#B8432F"/>
    <text x="110" y="121" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="12" font-weight="500" letter-spacing="2.6" fill="#5D635B">MENU BAR BREAK REMINDER</text>

    <text x="86" y="274" font-family="Spectral, Iowan Old Style, Georgia, serif"
          font-size="116" font-weight="300" letter-spacing="-3" fill="#171A17">Fermata</text>

    <text x="90" y="332" font-family="Noto Serif SC, Songti SC, serif"
          font-size="38" font-weight="300" letter-spacing="2" fill="#5D635B">停琴</text>

    <text x="88" y="404" font-family="Spectral, Iowan Old Style, Georgia, serif"
          font-size="30" font-weight="300" letter-spacing="0.2" fill="#3C403A">A break, held.</text>

    <text x="88" y="452" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="16" font-weight="400" fill="#5D635B">Short and long breaks on their own schedule,</text>
    <text x="88" y="476" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="16" font-weight="400" fill="#5D635B">then a quiet field for five or fifteen minutes.</text>

    <text x="88" y="560" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="11.5" font-weight="500" letter-spacing="1.6" fill="#7C8178">macOS 13+   ·   WINDOWS 11   ·   LINUX   ·   GO</text>
  </g>

  <!-- The break field, drawn as the app draws it -->
  <g>
    <rect x="688" y="80" width="504" height="480" rx="20" fill="#2B4A41"/>

    <text x="728" y="128" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="11" font-weight="500" letter-spacing="1.6" fill="#F3F2EA" fill-opacity="0.55">MINI BREAK</text>
    <text x="1152" y="128" text-anchor="end" font-family="Menlo, monospace"
          font-size="11" letter-spacing="0.6" fill="#F3F2EA" fill-opacity="0.55">14:32</text>

    <!-- The cool moon, 96 px box -->
    <g transform="translate(892 196)">
      <rect width="96" height="96" fill="#F3EEE2" mask="url(#banner-cool-moon-cut)"/>
      <circle cx="68.4375" cy="66.5625" r="5.0625" fill="#F0836C"/>
    </g>

    <text x="940" y="352" text-anchor="middle" font-family="Spectral, Iowan Old Style, Georgia, serif"
          font-size="29" font-weight="300" letter-spacing="-0.2" fill="#F3F2EA">Look out a window</text>
    <text x="940" y="390" text-anchor="middle" font-family="Spectral, Iowan Old Style, Georgia, serif"
          font-size="29" font-weight="300" letter-spacing="-0.2" fill="#F3F2EA">until your eyes relax.</text>

    <rect x="800" y="439" width="280" height="1" fill="#F3F2EA" fill-opacity="0.25"/>
    <rect x="800" y="439" width="112" height="1" fill="#F3F2EA" fill-opacity="0.85"/>

    <text x="940" y="476" text-anchor="middle" font-family="Menlo, monospace"
          font-size="13" letter-spacing="0.5" fill="#F3F2EA" fill-opacity="0.65">0:12</text>

    <text x="940" y="524" text-anchor="middle" font-family="SF Pro Text, Helvetica Neue, Arial, sans-serif"
          font-size="15" font-weight="400" fill="#F3F2EA" fill-opacity="0.82">Postpone <tspan font-family="Menlo, monospace" font-size="11" fill-opacity="0.6">⌘X</tspan></text>
  </g>
</svg>
