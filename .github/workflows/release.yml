name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The draft comes first: each platform uploads to the same release, and a
  # failure in one leaves the others' files in it rather than a release with
  # half the platforms.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Fermata ${GITHUB_REF_NAME#v}" \
            --generate-notes

  build:
    needs: draft
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            platform: darwin/universal
          - name: Windows
            os: windows-latest
            platform: windows/amd64,windows/arm64
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Version the build
        shell: bash
        run: ./tools/version.sh

      # The other platforms ran their checks in CI when the release was
      # merged; this one signs and packages the disk image.
      - name: Check
        if: matrix.name == 'macOS'
        run: make check

      # mygo build downloads NSIS on Windows; keep it between runs.
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}

      - name: Build
        shell: bash
        run: go tool mygo build -platform "${{ matrix.platform }}" -sign -

      - name: Collect the macOS files
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          set -eu
          version="$(python3 -c 'import json;print(json.load(open("mygo.json"))["version"])')"
          dmg="$(find build -type f -name '*.dmg' | head -n 1)"
          test -n "$dmg"
          mkdir -p dist
          cp "$dmg" "dist/fermata-$version-macos-universal.dmg"
          # The rolling name the landing page and the README point at.
          cp "$dmg" dist/fermata.dmg
          (cd dist && shasum -a 256 ./* > SHA256SUMS-macOS)

      - name: Collect the Windows files
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          set -eu
          version="$(python3 -c 'import json;print(json.load(open("mygo.json"))["version"])')"
          mkdir -p dist
          for arch in amd64 arm64; do
            go run ./tools/portablezip \
              -dir "build/windows-$arch" \
              -out "dist/fermata-$version-windows-$arch-portable.zip"
            cp "build/windows-$arch/fermata-setup-$version-$arch.exe" \
              "dist/fermata-$version-windows-$arch-setup.exe"
          done
          (cd dist && sha256sum ./* > SHA256SUMS-Windows)

      - name: Collect the Linux files
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          version="$(python3 -c 'import json;print(json.load(open("mygo.json"))["version"])')"
          for arch in amd64 arm64; do
            dir="build/linux-$arch"
            cp "$dir"/fermata_*.deb "dist/fermata-$version-linux-$arch.deb"
            for f in "$dir"/*.rpm; do cp "$f" "dist/fermata-$version-linux-$arch.rpm"; done
            cp "$dir"/*-"linux-$arch".tar.gz "dist/fermata-$version-linux-$arch.tar.gz"
            case $arch in
            amd64) pacman=x86_64 ;;
            arm64) pacman=aarch64 ;;
            esac
            cp "$dir/PKGBUILD" "dist/PKGBUILD-$pacman"
            if [ "$arch" = amd64 ]; then cp "$dir/install.sh" dist/install.sh; fi
          done
          (cd dist && sha256sum ./* > SHA256SUMS-Linux)

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # One checksum file for the whole release, then the draft becomes the
  # release people download: nothing is public until every platform is in.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge the checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # No checkout here: gh needs the repository named, not a clone.
          mkdir -p sums
          cd sums
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "SHA256SUMS-*" --clobber
          cat SHA256SUMS-* > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
