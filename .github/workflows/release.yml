name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version the build
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          python3 -c 'import json,sys; p="mygo.json"; d=json.load(open(p)); d["version"]=sys.argv[1]; json.dump(d, open(p,"w"), indent=2, ensure_ascii=False); open(p,"a").write("\n")' "$VERSION"

          COMMIT="$(git rev-parse --short HEAD)"
          perl -0pi -e "s/version = \"[^\"]*\"/version = \"$VERSION\"/; s/build   = \"[^\"]*\"/build   = \"${GITHUB_RUN_NUMBER}\"/; s/commit  = \"[^\"]*\"/commit  = \"$COMMIT\"/" main.go

      - name: Check
        run: make check

      - name: Build the disk image
        run: make dmg

      - name: Package the release
        run: |
          set -eu
          DMG="$(find build -type f -name '*.dmg' | head -n 1)"
          test -n "$DMG"
          mkdir -p dist
          cp "$DMG" "dist/Fermata-${VERSION}.dmg"
          cp "$DMG" "dist/Fermata.dmg"
          (cd dist && shasum -a 256 Fermata-*.dmg Fermata.dmg > SHA256SUMS)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "v$VERSION" dist/* \
            --verify-tag \
            --title "Fermata $VERSION" \
            --generate-notes
